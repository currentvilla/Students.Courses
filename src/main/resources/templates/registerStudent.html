<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>受講生登録</title>
</head>
<body>
<h1>受講生登録</h1>
<form th:action="@{/registerStudent}" th:object="${studentDetail}" method="post">

  <!-- 受講生情報 -->
  <h2>受講生情報</h2>
  <div>
    <label for="id">ID:</label>
    <input type="text" id="id" th:field="*{student.id}" required/>
  </div>
  <div>
    <label for="fullName">名前:</label>
    <input type="text" id="fullName" th:field="*{student.fullName}" required/>
  </div>
  <div>
    <label for="furigana">カナ名:</label>
    <input type="text" id="furigana" th:field="*{student.furigana}" required/>
  </div>
  <div>
    <label for="nickname">ニックネーム:</label>
    <input type="text" id="nickname" th:field="*{student.nickname}"/>
  </div>
  <div>
    <label for="email">メールアドレス:</label>
    <input type="email" id="email" th:field="*{student.email}" required/>
  </div>
  <div>
    <label for="area">地域:</label>
    <input type="text" id="area" th:field="*{student.area}"/>
  </div>
  <div>
    <label for="age">年齢:</label>
    <input type="number" id="age" th:field="*{student.age}"/>
  </div>
  <div>
    <label for="gender">性別:</label>
    <select id="gender" th:field="*{student.gender}">
      <option value="">選択してください</option>
      <option value="男性">男性</option>
      <option value="女性">女性</option>
      <option value="その他">その他</option>
    </select>
  </div>
  <div>
    <label for="remark">備考:</label>
    <textarea id="remark" th:field="*{student.remark}"></textarea>
  </div>

  <!-- コース情報 -->
  <h2>コース情報</h2>
  <div id="courseList">
    <div th:each="course, stat : *{studentCourses}" class="course-item">
      <h3>コース <span th:text="${stat.count}">1</span></h3>
      <div>
        <label th:for="'courseId' + ${stat.index}">コースID:</label>
        <input type="text" th:id="'courseId' + ${stat.index}"
               th:field="*{studentCourses[__${stat.index}__].id}" required/>
      </div>
      <div>
        <label th:for="'courseName' + ${stat.index}">コース名:</label>
        <input type="text" th:id="'courseName' + ${stat.index}"
               th:field="*{studentCourses[__${stat.index}__].courseName}" required/>
      </div>
      <div>
        <label th:for="'startDate' + ${stat.index}">開始日:</label>
        <input type="datetime-local" th:id="'startDate' + ${stat.index}"
               th:field="*{studentCourses[__${stat.index}__].startDate}" required/>
      </div>
      <div>
        <label th:for="'expectedEndDate' + ${stat.index}">終了予定日:</label>
        <input type="datetime-local" th:id="'expectedEndDate' + ${stat.index}"
               th:field="*{studentCourses[__${stat.index}__].expectedEndDate}" required/>
      </div>
      <hr/>
    </div>
  </div>

  <div>
    <button type="submit">登録</button>
  </div>
</form>
</body>
</html>
